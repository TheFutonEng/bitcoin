name: release

# Publishes a signed, attested image to GHCR on a version tag.
#
# The identity that `make verify-sig` expects for keyless verification is this
# workflow, on a tag — see RELEASE_IDENTITY in the Makefile. Renaming this file
# or changing the tag pattern breaks verification for everything already
# published, so do both together if ever needed.
#
# This is the only workflow with write access or secrets. ci.yml is triggered by
# pull requests, including from forks, and deliberately has neither.

on:
  push:
    tags: ['v*']
  # No inputs. The ref IS the version, and the guard below refuses anything that
  # is not a tag — so dispatch is for re-running a release, launched FROM the
  # tag. An input would be a second source of truth: dispatching from v31.1
  # while typing 30.2 would publish 30.2 signed with an identity claiming
  # refs/tags/v31.1, attesting to the wrong thing.
  workflow_dispatch:
    inputs:
      allow_keyless_only:
        description: 'Publish without the key-pair signature (breaks cosign verify --key)'
        type: boolean
        default: false

# Read-only by default. Only the publish job gets write access and an OIDC
# token, so the preflight jobs — including the one on the arm64 runner — can
# neither push nor sign even if something in them misbehaves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a publish midway

# The shape, and why. Every platform must be BOOTED before anything is
# published, and an arm64 binary can only be booted on arm64 hardware. So:
#
#   guard      refuse a bad ref, resolve the version, state the signing plan.
#   preflight  one job per platform on a NATIVE runner: the whole verification
#              chain, including smoke, against a local build. Keeps the contents
#              manifest of the image it booted.
#   publish    one job, amd64: pushes every platform as ONE index (arm64 is
#              cross-built, no emulation needed), then verifies each platform
#              BY DIGEST from the registry, proves each has exactly the files of
#              the image its preflight booted, proves each is reproducible, and
#              only then signs.
#
# Nothing is published until every preflight job has passed.
jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      revision: ${{ steps.v.outputs.revision }}
      tag: ${{ steps.v.outputs.tag }}
    env:
      # A key pair is optional. Keyless alone is a complete signing story; the
      # key exists for offline verification where Sigstore is unreachable.
      #
      # A missing key is now a FAILURE, not a warning. Once cosign.pub is
      # published, the README tells consumers to use `cosign verify --key`, and a
      # release without that signature silently breaks it for them. An external
      # review noted a release could otherwise downgrade to keyless-only while
      # reporting success. Use the allow_keyless_only input to do it on purpose.
      # Checked HERE, first, so a missing secret fails before any build runs.
      HAS_KEY: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publishing from a branch produces a keyless signature whose identity ends
      # @refs/heads/<branch>, which the documented consumer command — anchored on
      # @refs/tags/ — cannot verify. The workflow's own verify step derives the
      # identity from github.ref too, so it would pass: a green run publishing an
      # artifact nobody else can check. workflow_dispatch is still useful for
      # re-running a release, but it must be launched FROM THE TAG.
      - name: Refuse to publish from a non-tag ref
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/tags/*) echo "ref is a tag: ${{ github.ref }}" ;;
            *) echo "::error::Refusing to publish from ${{ github.ref }}." \
                    "Keyless signatures made here end @refs/heads/... and cannot be" \
                    "verified with the documented command. Re-run this workflow" \
                    "selecting the tag, not a branch."; exit 1 ;;
          esac

      # Tags are v<bitcoin version>-<image revision>, e.g. v31.1-1. The two halves
      # mean different things and are used in different places: the Bitcoin
      # version selects the release tarball and the signed sums, the revision
      # only names the packaging. Splitting them here is what stops
      # `make fetch-tarball` going looking for bitcoin-31.1-1-....tar.gz.
      - name: Resolve version and revision
        id: v
        run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          if [[ ! "${tag}" =~ ^v([0-9]+(\.[0-9]+)+)-([0-9]+)$ ]]; then
            echo "::error::tag '${tag}' is not v<bitcoin-version>-<revision>, e.g. v31.1-1"
            exit 1
          fi
          ver="${BASH_REMATCH[1]}"
          rev="${BASH_REMATCH[3]}"

          # The tag and the tree must agree. Nothing else catches this: the build
          # would succeed, the image would be labelled from the Makefile and
          # PUBLISHED under the tag, and the two would silently disagree. Since
          # the tag is not inside the artifact, a consumer who pinned the digest
          # would only ever see the label — so a mismatch is a mislabelled
          # release, not a naming inconvenience.
          mk_ver="$(make -s print-version)"
          mk_rev="$(make -s print-revision)"
          if [ "${ver}" != "${mk_ver}" ] || [ "${rev}" != "${mk_rev}" ]; then
            echo "::error::tag ${tag} disagrees with the tree: Makefile says ${mk_ver}-${mk_rev}"
            echo "::error::tag a commit whose VERSION and REVISION match, or fix them first"
            exit 1
          fi

          echo "version=${ver}"   >> "$GITHUB_OUTPUT"
          echo "revision=${rev}"  >> "$GITHUB_OUTPUT"
          echo "tag=${ver}-${rev}" >> "$GITHUB_OUTPUT"
          echo "publishing ${ver}-${rev} (bitcoin ${ver}, image revision ${rev}) from ${{ github.ref }}"

      # Say out loud which modes will be used. A misnamed secret previously
      # meant HAS_KEY was false, the key steps skipped, and the run went green
      # having published keyless-only — a silent downgrade.
      - name: Signing plan
        run: |
          set -euo pipefail
          echo "keyless:  yes (identity = this workflow on ${{ github.ref }})"
          if [ "${HAS_KEY}" = "true" ]; then
            echo "key pair: yes (COSIGN_KEY secret present)"
          elif [ "${{ inputs.allow_keyless_only }}" = "true" ]; then
            echo "key pair: NO — deliberately allowed via allow_keyless_only."
            echo "::warning::Publishing keyless-only by explicit request." \
                 "cosign verify --key will not work for this release."
          else
            echo "::error::COSIGN_KEY secret is empty or unset." \
                 "cosign.pub is published, so the README tells consumers to run" \
                 "cosign verify --key, which would fail for this release." \
                 "Set the secret, or re-run with allow_keyless_only=true."
            exit 1
          fi


  preflight:
    name: preflight (${{ matrix.arch }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      # Nothing is published unless both pass, so cancelling the other buys
      # nothing — and seeing which platforms fail is the diagnosis.
      fail-fast: false
      matrix:
        # Must list exactly the Makefile's PLATFORMS — check-pins.sh asserts it.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: linux/${{ matrix.arch }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the release tarball
        run: make fetch-tarball VERSION="${VERSION}"
      - name: Verify signatures and digest
        run: make verify VERSION="${VERSION}"
      - name: Cross-check against Core's verify.py
        run: make cross-check VERSION="${VERSION}"
      - name: Build
        run: make build VERSION="${VERSION}"
      # On this platform's own hardware: the binaries load and the node starts.
      - name: Smoke test
        run: make smoke VERSION="${VERSION}"
      - name: Verify image binaries
        run: make verify-image VERSION="${VERSION}"
      - name: Verify image contents
        run: make verify-contents VERSION="${VERSION}"
      # The inventory of the image that was just BOOTED. The publish job pushes
      # a different build — one index, cross-built — and compares the files of
      # what it pushed against this. That comparison is what lets "smoke passed"
      # carry over to the published image.
      - name: Keep the booted image's contents manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: booted-${{ matrix.arch }}
          path: contents-manifest.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish, verify, sign
    needs: [guard, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # REQUIRED for keyless signing — without it cosign has no
                        # OIDC token and the keyless step fails at the end, after
                        # the image is already public.
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      # The secret is named COSIGN_KEY. Note the name means two different
      # things either side of this workflow: the SECRET holds the key's
      # contents, while the make variable COSIGN_KEY is a PATH. The signing step
      # writes one to a file and passes the other.
      HAS_KEY: ${{ secrets.COSIGN_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned by version AND verified by hash. A repo that admits Bitcoin
      # binaries only on six builder signatures should not fetch the tool it
      # signs with over plain HTTPS and trust whatever arrives. Hashes are the
      # published ones from cosign_checksums.txt / syft checksums.txt; bumping a
      # version means updating the hash in the same reviewed commit.
      - name: Install cosign and syft
        env:
          COSIGN_VERSION: v3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          SYFT_VERSION: 1.51.1
          SYFT_SHA256: 8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"; echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          curl -sSfL -o /tmp/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          install -m 0755 /tmp/cosign "$HOME/.local/bin/cosign"

          curl -sSfL -o /tmp/syft.tgz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft
          install -m 0755 /tmp/syft "$HOME/.local/bin/syft"

          cosign version --json >/dev/null && syft version >/dev/null
          echo "cosign ${COSIGN_VERSION} and syft ${SYFT_VERSION} verified by hash"

      # Never publish something unverified. The whole chain runs first; any
      # failure here means nothing reaches the registry.
      # `make push` asks for --provenance=mode=max --sbom=true. The runner's
      # DEFAULT buildx builder uses the `docker` driver with the classic image
      # store, which cannot do attestations — that is exactly the error that
      # broke ci.yml ("Attestation is not supported for the docker driver").
      # It works on a dev box only if the containerd image store is enabled.
      # A docker-container builder supports them regardless. Verified 2026-09-19:
      # --push with mode=max through this driver produces an OCI index carrying
      # the attestation manifest.
      - name: Set up a buildx builder that supports attestations
        run: |
          set -euo pipefail
          # Idempotent. Not needed on GitHub-hosted runners, which are ephemeral
          # — this is belt and braces for anyone invoking the same commands by
          # hand or on a reused runner.
          #
          # Pinned buildkit, read from the Makefile so there is one source for
          # it. The push and the reproducibility check must assemble layers with
          # the SAME buildkit, or `make verify-repro-published` below would be
          # comparing an image built by one version against a rebuild by
          # another. Digests happen to agree across v0.29.0 and v0.32.2, but
          # "happens to agree" is not something to publish a claim on.
          BUILDKIT_IMAGE="$(make -s print-buildkit-image)"
          echo "buildkit: ${BUILDKIT_IMAGE}"
          docker buildx inspect release >/dev/null 2>&1 \
            || docker buildx create --name release --driver docker-container \
                 --driver-opt "image=${BUILDKIT_IMAGE}"
          docker buildx use release
          docker buildx inspect --bootstrap

      # Every platform's tarball, verified again on THIS runner, because these
      # are the bytes the push below builds from. The preflight jobs verified
      # their own copies on other machines.
      - name: Fetch and verify every platform's tarball
        run: |
          set -euo pipefail
          for p in $(make -s print-platforms); do
            make fetch-tarball VERSION="${VERSION}" PLATFORM="$p"
            make verify        VERSION="${VERSION}" PLATFORM="$p"
          done

      - name: Collect the booted images' contents manifests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: booted-*
          path: booted

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" \
          | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # ← the first irreversible step. Every platform, one index.
      - name: Push
        run: make push VERSION="${VERSION}"

      # Everything below reads the REGISTRY, by digest, per platform.
      #
      # This replaces a step that claimed to "re-verify the PUSHED image" and
      # never did: `make build` had put the same tag in the local store, so
      # `docker create` used the local copy and nothing was pulled. v31.1-1 was
      # still sound — verify-repro-published did read the registry, and matched
      # — but the step claimed more than it checked. A digest reference cannot be
      # satisfied by a different local image.
      #
      # Per platform, before anything is signed:
      #   verify-published   binaries MATCH, every file accounted for, and the
      #                      three predicates written — from the pushed digest.
      #   compare-contents   the pushed image has exactly the files of the one
      #                      its preflight job booted on native hardware.
      #   verify-repro-published
      #                      the pushed image is bit-for-bit what this tag
      #                      builds. Checks the IMAGE MANIFEST, not the index,
      #                      whose attestations carry per-build timestamps and
      #                      random ids by design. Do not "fix" this to compare
      #                      index digests. REPRO_BUILDER=release rebuilds on the
      #                      same daemon that built what is in the registry.
      - name: Verify every published platform, by digest
        run: |
          set -euo pipefail
          for p in $(make -s print-platforms); do
            arch="${p#*/}"
            echo "::group::${p}"
            make verify-published VERSION="${VERSION}" PLATFORM="$p"
            scripts/compare-contents.sh "booted/booted-${arch}/contents-manifest.json" \
              "predicates/${p//\//-}/contents-manifest.json"
            REPRO_BUILDER=release \
              make verify-repro-published VERSION="${VERSION}" PLATFORM="$p"
            echo "::endgroup::"
          done

      # Signs the index and every image in it, and attaches each platform's own
      # three predicates to that platform's digest — after checking each was
      # produced from that digest. See scripts/sign-image.sh.
      - name: Sign — keyless
        env:
          COSIGN_KEYLESS: '1'
        run: make sign VERSION="${VERSION}"

      - name: Sign — key pair
        if: env.HAS_KEY == 'true'
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Trap FIRST, before anything that can fail. `set -e` with a later
          # trap would leave the private key on disk if the step between them
          # errored — e.g. a wrong COSIGN_PASSWORD, which cosign does reject.
          trap 'shred -u /tmp/cosign.key 2>/dev/null || rm -f /tmp/cosign.key' EXIT
          umask 077
          printf '%s' "${{ secrets.COSIGN_KEY }}" > /tmp/cosign.key

          # The public half is derived here and deliberately NOT shredded: the
          # verify step below needs it to check the key-pair signature, and
          # signing something nothing verifies is the gap this PR exists to
          # close. It is a public key; only the private half is a secret.
          # Verified non-interactive against a password-protected key: cosign
          # reads COSIGN_PASSWORD from the environment, rejects a wrong one, and
          # exits rather than hanging when none is set (no TTY in CI).
          cosign public-key --key /tmp/cosign.key > /tmp/cosign.pub
          make sign VERSION="${VERSION}" COSIGN_KEY=/tmp/cosign.key

      # Verifies whichever modes were actually used. COSIGN_IDENTITY covers the
      # keyless signature; COSIGN_PUB is set only when a key pair was used, and
      # verify-signatures.sh checks a mode only when its config is present.
      - name: Verify the signing chain round-trips
        env:
          COSIGN_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          args=()
          if [ "${HAS_KEY}" = "true" ]; then args+=(COSIGN_PUB=/tmp/cosign.pub); fi
          make verify-sig VERSION="${VERSION}" "${args[@]}"

      # The index digest is what consumers pin. The per-platform image digests
      # are the reproducible part, and each was just proven equal to a rebuild of
      # this tag; they are also where the attestations live.
      - name: Publish the digests
        run: |
          set -euo pipefail
          ref="$(make -s digest-ref VERSION="${VERSION}")"
          platforms="$(scripts/list-platforms.sh "${ref}")"
          {
            echo "### Published"
            echo "Pin this (the multi-arch index):"
            echo '```'
            echo "${ref}"
            echo '```'
            echo "Reproducible image manifests, one per platform (rebuild this tag and compare):"
            echo '```'
            echo "${platforms}"
            echo '```'
            echo "\`git checkout ${{ github.ref_name }} && make fetch-tarball PLATFORM=<platform> && make verify-repro-published PLATFORM=<platform>\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "published ${ref}"
          echo "${platforms}"

      - name: Upload attestation inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.guard.outputs.tag }}-predicates
          path: predicates/
          if-no-files-found: warn
          retention-days: 90
