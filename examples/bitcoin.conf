# Example bitcoin.conf for ghcr.io/thefutoneng/bitcoin
# =====================================================
#
# This file is a TEACHING EXAMPLE, not a recommended configuration. Every
# setting below is commented out and every value is a placeholder. It exists to
# show how configuration reaches the container and which container-specific
# details will otherwise surprise you. It does not tell you how to run a node —
# that depends on your hardware, your network and your threat model, none of
# which this repository knows anything about.
#
# It is also a test fixture. `make test` mounts THIS FILE into the image, boots
# a node on it, and checks that every option named below still exists in the
# `bitcoind` actually shipped. An example nobody runs is an example that rots,
# and a stale one is worse than none: Bitcoin Core does NOT fail on an option it
# does not recognise, it prints "Ignoring unknown configuration value" and
# carries on. Your setting would silently do nothing.
#
#
# HOW TO USE IT
# -------------
#
# Two shapes, both supported. Pick whichever suits you.
#
# 1. Config inside the data volume. No flag needed — bitcoind reads
#    <datadir>/bitcoin.conf automatically, and the image sets the datadir.
#
#      docker run -v ./bitcoin.conf:/data/bitcoin.conf:ro \
#                 -v bitcoin-data:/data \
#                 ghcr.io/thefutoneng/bitcoin:31.1-1
#
# 2. Config somewhere else, named explicitly. Useful when you want to wipe the
#    chain without losing your settings, or mount config read-only from a
#    ConfigMap or a secret store.
#
#      docker run -v ./conf:/etc/bitcoin:ro \
#                 -v bitcoin-data:/data \
#                 ghcr.io/thefutoneng/bitcoin:31.1-1 \
#                 -conf=/etc/bitcoin/bitcoin.conf
#
#    A -conf path that does not exist is a HARD ERROR, not a warning, so the
#    image does not set one by default.
#
#
# WHAT IS DIFFERENT INSIDE THIS CONTAINER
# ---------------------------------------
#
# * datadir is already set. The image passes -datadir=/data, and /data is the
#   declared VOLUME. Setting it here does NOT work: Bitcoin Core accepts datadir
#   on the command line only and silently ignores it in a config file. If you
#   want a different location, pass -datadir= as an argument; the last one on
#   the command line wins.
#
# * printtoconsole is already set, so logs go to `docker logs`. Pass
#   -noprinttoconsole if you would rather they did not.
#
# * The RPC cookie lives in the datadir, so it is inside your volume, not the
#   image. Same for debug.log unless you move it.
#
# * There is no shell in this image. `docker exec ... sh` will not work. Run
#   bitcoin-cli as its own entrypoint instead, and give it the datadir, because
#   --entrypoint discards the image's own arguments:
#
#      docker run --rm --entrypoint /usr/local/bin/bitcoin-cli \
#                 -v bitcoin-data:/data \
#                 ghcr.io/thefutoneng/bitcoin:31.1-1 \
#                 -datadir=/data getblockchaininfo
#
#
# WHERE SETTINGS GO
# -----------------
#
# Settings above the first [section] apply to every network. Settings under a
# section apply only to that chain. Some options are network-scoped and MUST go
# in a section — Bitcoin Core will tell you which when it refuses to start.
#
# Section names are main, test, testnet4, signet and regtest.
#
#
# EXAMPLES — all commented, all placeholders
# ------------------------------------------
#
# Storage and indexes. Pruning discards old blocks to bound disk use and is
# incompatible with some indexes.
#
#prune=<mebibytes>
#txindex=<0-or-1>
#blockfilterindex=<0-or-1>
#
# Resources. Sensible values depend entirely on the machine.
#
#dbcache=<mebibytes>
#maxmempool=<mebibytes>
#par=<threads>
#
# Connectivity.
#
#maxconnections=<n>
#listen=<0-or-1>
#addnode=<host:port>
#connect=<host:port>
#onlynet=<network>
#proxy=<host:port>
#
# Logging. debuglogfile=0 disables the file and leaves only console output.
#
#debug=<category>
#debuglogfile=<path-or-0>
#
# ZMQ notifications. The image EXPOSEs 28332 and 28333 by convention, but
# nothing binds unless you set these.
#
#zmqpubrawblock=tcp://0.0.0.0:<port>
#zmqpubrawtx=tcp://0.0.0.0:<port>
#
#
# RPC — READ THIS BEFORE UNCOMMENTING ANYTHING
# --------------------------------------------
#
# Exposing the RPC interface is a deployment decision and it is genuinely
# dangerous to get wrong. An RPC port reachable by anyone who can guess or brute
# a credential is how people lose funds. This repository builds and verifies an
# image; it has no idea what your network looks like and will not pretend to.
#
# By default bitcoind binds RPC to loopback INSIDE the container, which nothing
# outside can reach, and authenticates with a cookie file in the datadir. That
# is the safe default and it is what you get by changing nothing here.
#
# If you need RPC from another container or host, you need all three of bind,
# allow and auth, and you need to understand each one. Generate rpcauth with the
# rpcauth.py script from the Bitcoin Core repository — never invent one by hand,
# and never commit the password.
#
#server=<0-or-1>
#rpcbind=<address>
#rpcallowip=<cidr>
#rpcauth=<user>:<salt>$<hmac>
#rpcport=<port>
#rpccookiefile=<path>
#
#
# NETWORK SECTIONS
# ----------------
#
# Present so the structure is visible. Empty sections are valid and do nothing.

[main]

[test]

[testnet4]

[signet]

[regtest]
